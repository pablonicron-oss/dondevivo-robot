name: Publicar web DóndeVivo

on:
  schedule:
    - cron: "17 * * * *"    # cada hora: la web muestra los avisos nuevos y saca los vendidos
    - cron: "47 * * * *"    # segunda vuelta por si GitHub saltea la primera
  push:
    branches: [main]
    paths: ["web/**", "robot/exportar.py", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m robot.exportar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - run: sed -i "s/__V__/${GITHUB_SHA::8}-$(date +%s)/g" web/*.html   # que el navegador no guarde versiones viejas
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
