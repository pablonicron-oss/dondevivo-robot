<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Panel · DóndeVivo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M7 29L32 9l25 20' fill='none' stroke='%231F4FE0' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='21' cy='44' r='9.5' fill='%23fff' stroke='%23101828' stroke-width='1.8'/%3E%3Ccircle cx='21' cy='45' r='4.8' fill='%23101828'/%3E%3Ccircle cx='43' cy='44' r='9.5' fill='%23fff' stroke='%23101828' stroke-width='1.8'/%3E%3Ccircle cx='43' cy='45' r='4.8' fill='%23101828'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@700;800&display=swap">
<style>
:root{--azul:#1F4FE0;--verde:#0B7A5E;--amarillo:#F5B700;--tinta:#101828;--gris:#475467;--suave:#667085;--linea:#EAECF0;--fondo:#EEF1F6}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:'Manrope',system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 56px}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0}
.logo{text-decoration:none;display:flex;align-items:center;gap:10px}
.logo span{font-family:'Outfit',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.045em;line-height:1}
h1{margin:6px 0 18px;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.035em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:#fff;border-radius:22px;padding:18px 20px}
.kpi b{display:block;font-family:'Outfit',sans-serif;font-size:34px;letter-spacing:-.03em;line-height:1.05}
.kpi span{font-size:14px;color:var(--gris);font-weight:700}
.kpi.ok b{color:var(--verde);font-size:28px}.kpi.av b{color:#B54708}
.barra{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.seg{display:flex;flex-wrap:wrap;background:#fff;border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;font:inherit;font-weight:800;font-size:14px;padding:0 14px;min-height:38px;border-radius:10px;cursor:pointer;color:var(--gris)}
.seg button[aria-pressed="true"]{background:var(--tinta);color:#fff}
input.buscar{flex:1;min-width:220px;min-height:46px;border:0;border-radius:14px;padding:0 16px;font:inherit;font-size:15px}
.fila{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:#fff;border-radius:22px;padding:14px;margin-bottom:10px}
.foto{flex:none;width:96px;height:72px;border-radius:14px;background:#D9E0EC center/cover no-repeat}
.info{flex:1 1 300px;min-width:0}
.info b{display:block;font-size:16px;line-height:1.25}
.info .sub{font-size:13px;color:var(--gris);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:#F2F4F7;color:var(--gris)}
.chip.ok{background:#D1FADF;color:#05603A}.chip.pausa{background:#FEF0C7;color:#93370D}.chip.no{background:#FEE4E2;color:#B42318}.chip.dest{background:var(--amarillo);color:var(--tinta)}.chip.rev{background:#DCE6FF;color:#1F4FE0}
.nums{display:flex;gap:18px;font-size:13px;color:var(--gris);font-weight:700}
.nums b{display:block;font-family:'Outfit',sans-serif;font-size:22px;color:var(--tinta)}
.acc{display:flex;flex-wrap:wrap;gap:6px}
.acc a{font-size:13px;font-weight:800;text-decoration:none;padding:9px 12px;border-radius:10px;border:2px solid #D0D5DD;white-space:nowrap}
.acc a.ok{background:var(--verde);border-color:var(--verde);color:#fff}.acc a.no{color:#B42318;border-color:#FDA29B}
h2{margin:30px 0 12px;font-size:22px;letter-spacing:-.02em}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:18px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--linea)}th{color:var(--gris);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.vacio{background:#fff;border-radius:22px;padding:22px;color:var(--gris)}
.tabs{display:flex;gap:8px;margin:0 0 18px}
.tabs button{border:0;font:inherit;font-weight:800;font-size:16px;padding:0 18px;min-height:44px;border-radius:14px;cursor:pointer;background:#fff;color:var(--gris)}
.tabs button[aria-pressed="true"]{background:var(--azul);color:#fff}
.ava{flex:none;width:56px;height:56px;border-radius:50%;background:#DCE6FF;color:var(--azul);display:grid;place-items:center;font-family:'Outfit',sans-serif;font-weight:800;font-size:22px}
.mini{font-size:13px;color:var(--gris);margin-top:6px;line-height:1.5}
.mini a{font-weight:700}
.acc button{font:inherit;font-size:13px;font-weight:800;padding:9px 12px;border-radius:10px;border:2px solid var(--azul);background:var(--azul);color:#fff;cursor:pointer;white-space:nowrap}
.velo{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;justify-content:flex-end;z-index:20}
.cajon{background:var(--fondo);width:min(560px,100%);height:100%;display:flex;flex-direction:column}
.cab{background:#fff;padding:18px 20px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--linea)}
.cab b{display:block;font-size:17px}.cab .x{margin-left:auto;border:0;background:#F2F4F7;width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.hilo{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.burbuja{background:#fff;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5}
.burbuja.yo{background:#DCE6FF;align-self:flex-end;max-width:85%}
.burbuja .meta{font-size:12px;color:var(--suave);font-weight:700;margin-bottom:4px}
.borr{background:#fff;border:2px solid var(--azul);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.borr input,.borr textarea,.pie textarea{font:inherit;font-size:15px;border:2px solid #D0D5DD;border-radius:12px;padding:10px 12px;width:100%;color:var(--tinta)}
.borr textarea{min-height:220px;resize:vertical;line-height:1.5}
.pie{background:#fff;padding:14px 20px;border-top:1px solid var(--linea);display:flex;gap:10px;align-items:flex-end}
.pie textarea{min-height:52px;max-height:160px;resize:vertical}
.btn{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:12px;padding:0 16px;min-height:48px;cursor:pointer;background:var(--azul);color:#fff;white-space:nowrap}
.btn.ok{background:var(--verde)}.btn:disabled{opacity:.5;cursor:default}
.aviso-txt{font-size:13px;color:var(--suave)}
</style>
</head>
<body>
<div class="wrap">
<nav>
  <a class="logo" href="./" aria-label="DóndeVivo, inicio"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 64 64"><path d="M7 29L32 9l25 20" fill="none" stroke="#1F4FE0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="21" cy="44" r="9.5" fill="#FFFFFF" stroke="#101828" stroke-width="1.8"></circle><circle cx="21" cy="45" r="4.8" fill="#101828"></circle><circle cx="43" cy="44" r="9.5" fill="#FFFFFF" stroke="#101828" stroke-width="1.8"></circle><circle cx="43" cy="45" r="4.8" fill="#101828"></circle></svg><span><span style="color:#101828">dónde</span><span style="color:#1F4FE0">vivo</span></span></a>
  <div style="font-weight:700;color:var(--gris)">Tu panel</div>
</nav>
<div id="app"><div class="vacio">Cargando…</div></div>
</div>
<script src="config.js?v=__V__"></script>
<script>
(function () {
  var CFG = window.DV || {}, $ = document.getElementById("app"), T = new URLSearchParams(location.search).get("t");
  var D = null, filtro = "todos", txt = "", vista = "avisos", chat = null;
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function gs(n) { return "Gs. " + String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
  function f(d) { return d ? new Date(d).toLocaleDateString("es-PY", { day: "2-digit", month: "2-digit" }) : ""; }
  function dest(a) { return a.destacado_hasta && new Date(a.destacado_hasta) > new Date(); }
  function estado(a) {
    if (a.motivo === "en revisión") return "revision";
    if (a.motivo === "rechazado") return "rechazado";
    if (a.motivo === "pausado") return "pausado";
    if (a.motivo === "alquilado" || a.motivo === "vendido") return "cerrado";
    return a.activo ? "publicado" : "otro";
  }
  var CHIP = { revision: '<span class="chip rev">En revisión</span>', rechazado: '<span class="chip no">Rechazado</span>', pausado: '<span class="chip pausa">Pausado</span>',
    cerrado: '<span class="chip no">Cerrado</span>', publicado: '<span class="chip ok">Publicado</span>', otro: '<span class="chip">No visible</span>' };

  function pintar() {
    if (vista === "anunciantes") return pintarGente();
    var av = D.avisos, ahora = new Date(), mes = ahora.getFullYear() + "-" + String(ahora.getMonth() + 1).padStart(2, "0");
    var ventasMes = D.pedidos.filter(function (p) { return p.estado === "confirmado" && String(p.resuelto || p.creado).slice(0, 7) === mes; });
    var pend = D.pedidos.filter(function (p) { return p.estado === "pendiente"; }).length;
    var lista = av.filter(function (a) {
      var e = estado(a);
      if (filtro === "revision" && e !== "revision") return false;
      if (filtro === "publicados" && e !== "publicado") return false;
      if (filtro === "destacados" && !dest(a)) return false;
      if (filtro === "otros" && (e === "publicado" || e === "revision")) return false;
      if (txt && (a.titulo + " " + a.email + " " + a.whatsapp + " #" + a.numero + " " + a.ciudad + " " + a.barrio).toLowerCase().indexOf(txt) < 0) return false;
      return true;
    });
    $.innerHTML = "<h1>Tu panel de DóndeVivo</h1>" + tabs() +
      '<div class="kpis">' +
        '<div class="kpi"><b>' + av.length + "</b><span>avisos en total</span></div>" +
        '<div class="kpi"><b>' + av.filter(function (a) { return estado(a) === "publicado"; }).length + "</b><span>publicados</span></div>" +
        '<div class="kpi av"><b>' + av.filter(function (a) { return estado(a) === "revision"; }).length + "</b><span>esperando tu aprobación</span></div>" +
        '<div class="kpi"><b>' + av.filter(dest).length + "</b><span>destacados ahora</span></div>" +
        '<div class="kpi ok"><b>' + gs(ventasMes.reduce(function (t, p) { return t + (p.monto || 0); }, 0)) + "</b><span>" + ventasMes.length + " ventas este mes</span></div>" +
        '<div class="kpi"><b>' + pend + "</b><span>pagos por confirmar</span></div>" +
      "</div>" +
      '<div class="barra"><div class="seg">' + [["todos", "Todos"], ["revision", "En revisión"], ["publicados", "Publicados"], ["destacados", "Destacados"], ["otros", "Pausados y cerrados"]].map(function (x) {
        return '<button data-f="' + x[0] + '" aria-pressed="' + (filtro === x[0]) + '">' + x[1] + "</button>"; }).join("") +
      '</div><input class="buscar" id="bu" placeholder="Buscar por título, correo, WhatsApp, número o barrio" value="' + esc(txt) + '"></div>' +
      (lista.length ? lista.map(function (a) {
        var e = estado(a);
        return '<div class="fila"><div class="foto" style="background-image:url(\'' + esc(a.foto || "") + '\')"></div>' +
          '<div class="info"><b>' + esc(a.titulo || "Sin título") + '</b><div class="sub">' + esc([a.numero ? "#" + a.numero : "", a.precio ? (a.moneda === "USD" ? "USD " + a.precio : gs(a.precio)) : "", [a.barrio, a.ciudad].filter(Boolean).join(", "), "publicado el " + f(a.creado)].filter(Boolean).join(" · ")) + "</div>" +
          '<div class="sub">' + esc(a.email) + ' · <a href="https://wa.me/' + esc(a.whatsapp) + '" target="_blank" rel="noopener">' + esc(a.whatsapp) + "</a>" + (a.baja ? " · no quiere correos" : "") + "</div>" +
          '<div class="chips">' + CHIP[e] + (dest(a) ? '<span class="chip dest">Destacado hasta ' + f(a.destacado_hasta) + "</span>" : "") + "</div></div>" +
          '<div class="nums"><div><b>' + a.vistas + "</b>visitas</div><div><b>" + a.contactos + "</b>contactos</div></div>" +
          '<div class="acc">' + (a.aprobar ? '<a class="ok" href="' + esc(a.aprobar) + '" target="_blank" rel="noopener">Aprobar</a><a class="no" href="' + esc(a.rechazar) + '" target="_blank" rel="noopener">Rechazar</a>' : "") +
            (a.activo ? '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">Ver</a>' : "") +
            '<a href="' + esc(a.panel) + '" target="_blank" rel="noopener">Su panel</a></div></div>';
      }).join("") : '<div class="vacio">No hay avisos con este filtro.</div>') +
      "<h2>Pagos de destacados</h2>" +
      (D.pedidos.length ? "<table><tr><th>Pedido</th><th>Aviso</th><th>Plan</th><th>Monto</th><th>Código</th><th>Estado</th><th>Fecha</th></tr>" + D.pedidos.map(function (p) {
        return "<tr><td>" + esc(p.codigo) + "</td><td>" + (p.numero ? "#" + p.numero : "") + "</td><td>" + p.plan_dias + " días</td><td>" + gs(p.monto) + "</td><td>" + esc(p.cupon || "") + "</td><td>" + esc(p.estado) + "</td><td>" + f(p.creado) + "</td></tr>";
      }).join("") + "</table>" : '<div class="vacio">Todavía no hay pagos.</div>');
    $.querySelectorAll("[data-f]").forEach(function (b) { b.onclick = function () { filtro = b.dataset.f; pintar(); }; });
    enganchar();
    var bu = document.getElementById("bu");
    bu.oninput = function () { txt = bu.value.trim().toLowerCase(); var pos = bu.selectionStart; pintar(); var n = document.getElementById("bu"); n.focus(); n.setSelectionRange(pos, pos); };
  }

  function tabs() {
    return '<div class="tabs">' + [["avisos", "Avisos"], ["anunciantes", "Anunciantes"]].map(function (x) {
      return '<button data-v="' + x[0] + '" aria-pressed="' + (vista === x[0]) + '">' + x[1] + "</button>"; }).join("") + "</div>";
  }
  function enganchar() {
    $.querySelectorAll("[data-v]").forEach(function (b) { b.onclick = function () { vista = b.dataset.v; txt = ""; pintar(); }; });
    $.querySelectorAll("[data-chat]").forEach(function (b) { b.onclick = function () { abrirChat(b.dataset.chat); }; });
  }
  function personas() {
    var m = {};
    D.avisos.forEach(function (a) {
      var k = (a.email || "").toLowerCase(), p = m[k] || (m[k] = { email: k, nombre: "", whatsapp: a.whatsapp, avisos: [], correos: [], baja: true, vistas: 0, contactos: 0, ultimo: a.creado, panel: a.panel });
      p.avisos.push(a); if (a.nombre) p.nombre = a.nombre; if (!a.baja) p.baja = false;
      p.vistas += a.vistas; p.contactos += a.contactos; p.correos = p.correos.concat(a.correos || []);
      if (a.creado > p.ultimo) { p.ultimo = a.creado; p.whatsapp = a.whatsapp; }
    });
    return Object.keys(m).map(function (k) { var p = m[k]; p.correos.sort(function (x, y) { return x.fecha < y.fecha ? -1 : 1; }); return p; })
      .sort(function (x, y) { return x.ultimo < y.ultimo ? 1 : -1; });
  }
  function pl(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
  function inicial(p) { return esc(((p.nombre || p.email || "?").trim()[0] || "?").toUpperCase()); }
  function pintarGente() {
    var gente = personas();
    var lista = gente.filter(function (p) {
      return !txt || (p.nombre + " " + p.email + " " + p.whatsapp + " " + p.avisos.map(function (a) { return "#" + a.numero + " " + a.titulo + " " + a.barrio; }).join(" ")).toLowerCase().indexOf(txt) >= 0;
    });
    var conDest = gente.filter(function (p) { return p.avisos.some(dest); }).length;
    $.innerHTML = "<h1>Tu panel de DóndeVivo</h1>" + tabs() +
      '<div class="kpis">' +
        '<div class="kpi"><b>' + gente.length + "</b><span>anunciantes</span></div>" +
        '<div class="kpi"><b>' + conDest + "</b><span>con algún destacado</span></div>" +
        '<div class="kpi"><b>' + (gente.length - conDest) + "</b><span>solo gratis</span></div>" +
        '<div class="kpi"><b>' + gente.filter(function (p) { return !p.baja; }).length + "</b><span>aceptan correos</span></div>" +
        '<div class="kpi"><b>' + (D.quedan == null ? "-" : D.quedan) + "</b><span>correos que podés mandar hoy</span></div>" +
      "</div>" +
      '<div class="barra"><input class="buscar" id="bu" placeholder="Buscar por nombre, correo, WhatsApp, número o barrio" value="' + esc(txt) + '"></div>' +
      (lista.length ? lista.map(function (p) {
        var pub = p.avisos.filter(function (a) { return estado(a) === "publicado"; }).length, d = p.avisos.filter(dest).length, rev = p.avisos.filter(function (a) { return estado(a) === "revision"; }).length;
        return '<div class="fila"><div class="ava">' + inicial(p) + "</div>" +
          '<div class="info"><b>' + esc(p.nombre || "Sin nombre") + '</b><div class="sub">' + esc(p.email) + ' · <a href="https://wa.me/' + esc(p.whatsapp) + '" target="_blank" rel="noopener">' + esc(p.whatsapp) + "</a></div>" +
          '<div class="chips"><span class="chip">' + p.avisos.length + (p.avisos.length === 1 ? " aviso" : " avisos") + "</span>" +
            (pub ? '<span class="chip ok">' + pl(pub, "publicado", "publicados") + "</span>" : "") + (d ? '<span class="chip dest">' + pl(d, "destacado", "destacados") + "</span>" : '<span class="chip">Solo gratis</span>') +
            (rev ? '<span class="chip rev">' + rev + " en revisión</span>" : "") + (p.baja ? '<span class="chip no">No quiere correos</span>' : "") +
            (p.correos.length ? '<span class="chip">' + pl(p.correos.length, "correo tuyo", "correos tuyos") + "</span>" : "") + "</div>" +
          '<div class="mini">' + p.avisos.map(function (a) { return (a.numero ? "#" + a.numero + " " : "") + '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.titulo || "Sin título") + "</a>"; }).join("<br>") + "</div></div>" +
          '<div class="nums"><div><b>' + p.vistas + "</b>visitas</div><div><b>" + p.contactos + "</b>contactos</div></div>" +
          '<div class="acc">' + (p.baja ? "" : '<button data-chat="' + esc(p.email) + '">Escribirle</button>') + '<a href="' + esc(p.panel) + '" target="_blank" rel="noopener">Su panel</a></div></div>';
      }).join("") : '<div class="vacio">Todavía no hay anunciantes.</div>');
    var bu = document.getElementById("bu");
    bu.oninput = function () { txt = bu.value.trim().toLowerCase(); var pos = bu.selectionStart; pintar(); var n = document.getElementById("bu"); n.focus(); n.setSelectionRange(pos, pos); };
    enganchar();
  }

  /* ---------- chat para escribirle a un anunciante ---------- */
  function post(body) {
    return fetch(CFG.endpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }
  function abrirChat(email) {
    var p = personas().filter(function (x) { return x.email === email; })[0]; if (!p) return;
    chat = { p: p, pasos: [], borrador: null, ocupado: false, error: "" };
    p.correos.forEach(function (c) { chat.pasos.push({ tipo: "enviado", c: c }); });
    pintarChat();
  }
  function cerrarChat() { chat = null; var v = document.getElementById("velo"); if (v) v.remove(); }
  function pintarChat() {
    var v = document.getElementById("velo");
    if (!v) { v = document.createElement("div"); v.id = "velo"; v.className = "velo"; document.body.appendChild(v); v.onclick = function (e) { if (e.target === v) cerrarChat(); }; }
    var p = chat.p;
    v.innerHTML = '<div class="cajon" role="dialog" aria-label="Escribirle a ' + esc(p.nombre || p.email) + '">' +
      '<div class="cab"><div class="ava">' + inicial(p) + '</div><div><b>' + esc(p.nombre || "Sin nombre") + '</b><span class="aviso-txt">' + esc(p.email) + "</span></div>" +
        '<button class="x" id="cx" aria-label="Cerrar">×</button></div>' +
      '<div class="hilo" id="hilo">' +
        (chat.pasos.length ? "" : '<div class="burbuja"><div class="meta">Cómo funciona</div>Escribí abajo lo que le querés decir, por ejemplo decile que mejore la foto de portada y que sume una foto más del baño. La IA arma el correo con los datos de sus avisos, lo revisás, lo podés cambiar y recién ahí lo mandás.</div>') +
        chat.pasos.map(function (s) {
          if (s.tipo === "pedido") return '<div class="burbuja yo">' + esc(s.texto) + "</div>";
          if (s.tipo === "enviado") return '<div class="burbuja"><div class="meta">Correo enviado el ' + new Date(s.c.fecha).toLocaleString("es-PY", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + "</div><b>" + esc(s.c.asunto) + "</b><br>" + esc(s.c.cuerpo).replace(/\n/g, "<br>") + "</div>";
          return "";
        }).join("") +
        (chat.borrador ? '<div class="borr"><div class="meta aviso-txt">Borrador. Podés cambiar lo que quieras antes de mandarlo.</div>' +
          '<input id="bas" value="' + esc(chat.borrador.asunto) + '" aria-label="Asunto">' +
          '<textarea id="bcu" aria-label="Texto del correo">' + esc(chat.borrador.cuerpo) + "</textarea>" +
          '<button class="btn ok" id="benv"' + (chat.ocupado ? " disabled" : "") + ">Enviar correo a " + esc(p.nombre ? p.nombre.split(" ")[0] : p.email) + "</button></div>" : "") +
        (chat.ocupado ? '<div class="aviso-txt">Un momento…</div>' : "") +
        (chat.error ? '<div class="burbuja" style="color:#B42318">' + esc(chat.error) + "</div>" : "") +
      "</div>" +
      '<div class="pie"><textarea id="ped" placeholder="' + (chat.borrador ? "Pedile un cambio, por ejemplo más corto" : "Qué le querés decir") + '"></textarea>' +
        '<button class="btn" id="bred"' + (chat.ocupado ? " disabled" : "") + ">" + (chat.borrador ? "Cambiar" : "Redactar") + "</button></div></div>";
    var h = document.getElementById("hilo"); h.scrollTop = h.scrollHeight;
    document.getElementById("cx").onclick = cerrarChat;
    var ped = document.getElementById("ped");
    ped.onkeydown = function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); redactar(); } };
    document.getElementById("bred").onclick = redactar;
    var be = document.getElementById("benv"); if (be) be.onclick = enviar;
    if (!chat.borrador) ped.focus();
  }
  function guardarBorrador() {
    var a = document.getElementById("bas"), c = document.getElementById("bcu");
    if (a && chat.borrador) { chat.borrador.asunto = a.value; chat.borrador.cuerpo = c.value; }
  }
  function redactar() {
    var texto = document.getElementById("ped").value.trim(); if (!texto || chat.ocupado) return;
    guardarBorrador();
    chat.pasos.push({ tipo: "pedido", texto: texto }); chat.ocupado = true; chat.error = ""; pintarChat();
    post({ tipo: "admin_redactar", t: T, email: chat.p.email, pedido: texto, borrador: chat.borrador }).then(function (r) {
      chat.ocupado = false;
      if (r.ok) chat.borrador = { asunto: r.asunto, cuerpo: r.cuerpo }; else chat.error = r.error || "No se pudo redactar.";
      pintarChat();
    }).catch(function () { chat.ocupado = false; chat.error = "No hubo conexión. Probá de nuevo."; pintarChat(); });
  }
  function enviar() {
    guardarBorrador(); if (!chat.borrador || chat.ocupado) return;
    var b = chat.borrador; chat.ocupado = true; chat.error = ""; pintarChat();
    post({ tipo: "admin_enviar", t: T, email: chat.p.email, asunto: b.asunto, cuerpo: b.cuerpo }).then(function (r) {
      chat.ocupado = false;
      if (r.ok) {
        var c = r.correos[r.correos.length - 1]; chat.pasos.push({ tipo: "enviado", c: c }); chat.borrador = null;
        D.avisos.forEach(function (a) { if ((a.email || "").toLowerCase() === chat.p.email) a.correos = []; });
        var ult = D.avisos.filter(function (a) { return (a.email || "").toLowerCase() === chat.p.email; })[0]; if (ult) ult.correos = r.correos;
        if (D.quedan) D.quedan--;
        pintar();
      } else chat.error = r.error || "No se pudo enviar.";
      pintarChat();
    }).catch(function () { chat.ocupado = false; chat.error = "No hubo conexión. Probá de nuevo."; pintarChat(); });
  }
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && chat) cerrarChat(); });

  if (!T || !CFG.endpoint) { $.innerHTML = '<div class="vacio">Abrí el link de tu panel.</div>'; return; }
  fetch(CFG.endpoint + "?accion=admin&t=" + encodeURIComponent(T)).then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) { $.innerHTML = '<div class="vacio">' + esc(d.error || "No se pudo cargar.") + "</div>"; return; }
    D = d; pintar();
  }).catch(function () { $.innerHTML = '<div class="vacio">No pudimos cargar el panel. Probá recargar.</div>'; });
})();
</script>
</body>
</html>
