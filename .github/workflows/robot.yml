name: Robot DóndeVivo

on:
  schedule:
    - cron: "37 5 * * *"    # 02:37 de Paraguay (fuera de la hora pico de GitHub)
    - cron: "37 11 * * *"   # 08:37 de Paraguay
    - cron: "37 17 * * *"   # 14:37 de Paraguay
    - cron: "37 23 * * *"   # 20:37 de Paraguay
  workflow_dispatch:         # botón para correrlo a mano

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: liskin/gh-workflow-keepalive@v1   # evita que GitHub apague el horario tras 60 días sin cambios
      - run: python -m robot.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # solo para pedirle a GitHub que actualice la web
